<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Komoot Cleanup</title>
    <style>
        body {
            width: 300px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }
        .power-button {
            width: 40px;
            height: 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            background-color: #4CAF50;
            position: relative;
        }
        .power-button.off {
            background-color: #ccc;
        }
        .power-button::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }
        .power-button.off::after {
            left: 18px;
        }
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-group.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        input[type="checkbox"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>🧹 Komoot Feed Cleanup</h2>
    <button id="powerButton" class="power-button" title="Toggle extension on/off"></button>
</div>
<div class="settings-group" id="settingsGroup">
    <label>
        <input type="checkbox" id="hideSponsored" data-setting="hideSponsored" checked>
        Hide Sponsored Posts
    </label>
    <label>
        <input type="checkbox" id="hideKomootCollections" data-setting="hideKomootCollections" checked>
        Hide Komoot Collections
    </label>
    <label>
        <input type="checkbox" id="hideRegional" data-setting="hideRegional" checked>
        Hide Regional Posts
    </label>
    <label>
        <input type="checkbox" id="hideSuggestedProfiles" data-setting="hideSuggestedProfiles" checked>
        Hide Suggested Profiles
    </label>
</div>
<script src="popup.js"></script>
</body>
</html>
