<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Komoot Cleanup</title>
    <style>
        body {
            width: 300px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        .power-button {
            width: 44px;
            height: 26px;
            border-radius: 999px;
            border: 1px solid #bdbdbd;
            cursor: pointer;
            position: relative;
            background-color: #cfcfcf;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            flex: 0 0 auto;
        }

        .power-button.on {
            background-color: #4caf50;
            border-color: #3f8f42;
        }

        .power-button::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: left 0.2s ease;
        }

        .power-button.on::after {
            left: 23px;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-group.disabled {
            opacity: 0.5;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="checkbox"] {
            cursor: pointer;
        }

        input[type="checkbox"]:disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>Komoot Feed Cleanup</h2>
    <button id="powerButton" class="power-button off" title="Toggle extension on/off"
            aria-label="Toggle extension"></button>
</div>

<div class="settings-group" id="settingsGroup">
    <label>
        <input type="checkbox" id="hideSponsored" data-setting="hideSponsored" checked>
        Hide Sponsored Posts
    </label>

    <label>
        <input type="checkbox" id="hideKomootCollections" data-setting="hideKomootCollections" checked>
        Hide Komoot Collections
    </label>

    <label>
        <input type="checkbox" id="hideRegional" data-setting="hideRegional" checked>
        Hide Regional Posts
    </label>

    <label>
        <input type="checkbox" id="hideSuggestedProfiles" data-setting="hideSuggestedProfiles" checked>
        Hide Suggested Profiles
    </label>

    <label>
        <input type="checkbox" id="hideWhatsNew" data-setting="hideWhatsNew" checked>
        Hide "What's New" Feature Updates
    </label>
</div>

<script src="popup.js"></script>
</body>
</html>
